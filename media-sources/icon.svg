<?xml version="1.0" encoding="UTF-8"?>
<!-- ShrinkPub app icon master (design source).
     A book being squeezed smaller from both sides, in a classic-Mac
     black-outline style that stays legible at 16px.
     Regenerate the derived icons after editing:
       rsvg-convert -w 1024 -h 1024 media-sources/icon.svg -o media-sources/icon.png
       npm run tauri icon media-sources/icon.png
       rsvg-convert -w 64 -h 64 media-sources/icon.svg -o static/favicon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- book block -->
  <g>
    <!-- page block behind the cover -->
    <rect x="352" y="240" width="352" height="560" fill="#ffffff" stroke="#000000" stroke-width="24"/>
    <!-- page edge lines -->
    <line x1="352" y1="284" x2="704" y2="284" stroke="#000000" stroke-width="10" opacity="0.25"/>
    <line x1="352" y1="316" x2="704" y2="316" stroke="#000000" stroke-width="10" opacity="0.25"/>
    <!-- cover -->
    <rect x="320" y="208" width="352" height="560" rx="18" fill="#f4f0e4" stroke="#000000" stroke-width="26"/>
    <!-- spine band -->
    <rect x="320" y="208" width="64" height="560" fill="#000000" opacity="0.85"/>
    <!-- title lines on the cover -->
    <rect x="430" y="300" width="196" height="34" fill="#000000"/>
    <rect x="430" y="360" width="140" height="22" fill="#000000" opacity="0.55"/>
    <!-- squeezed "compression" creases -->
    <path d="M 672 320 q 24 192 0 336" fill="none" stroke="#000000" stroke-width="12" opacity="0.35"/>
  </g>
  <!-- inward arrows -->
  <g fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round">
    <polygon points="56,448 168,448 168,376 292,512 168,648 168,576 56,576"/>
    <polygon points="968,448 856,448 856,376 732,512 856,648 856,576 968,576"/>
  </g>
</svg>
