name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Install & syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile is committed (no package-lock.json / yarn.lock), so use
      # `npm install` rather than `npm ci` (which requires a lockfile).
      - name: Install dependencies
        run: npm install

      # The project defines no lint or test scripts, so this is a lightweight
      # syntax check only. `node --check` parses each top-level source file and
      # fails on syntax errors without executing them. The files checked are the
      # main entry (main.js) plus the other top-level scripts (preload.js,
      # renderer.js). index.html is markup and is not checked here.
      - name: Syntax check (node --check)
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
