[workspace]
members = [
  "crates/shrinkpub-core",
  "crates/shrinkpub-cli",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["ShrinkPub contributors"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imagequant = "4"
lodepng = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
